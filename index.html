<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Image Generator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #loading {
            margin-top: 20px;
            font-size: 18px;
            color: blue;
            display: none;
        }

        #resultImage {
            margin-top: 30px;
            max-width: 100%;
            border: 1px solid #ccc;
            display: none;
        }

        #downloadButton {
            display: none;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <h1>GPT Image Generator</h1>

    <textarea id="promptInput"
        placeholder="生成したい画像を入力してください"></textarea>

    <br>

    <button onclick="generateImage()">
        画像生成
    </button>

    <div id="loading">
        画像生成中です...（数分かかることがあります）
    </div>

    <img id="resultImage">

    <br>

    <a id="downloadButton" download="generated_image.png">
        <button>画像ダウンロード</button>
    </a>

    <script>

        async function generateImage() {

            const prompt =
                document.getElementById('promptInput').value;

            if (!prompt) {
                alert('プロンプトを入力してください');
                return;
            }

            const loading =
                document.getElementById('loading');

            const image =
                document.getElementById('resultImage');

            const downloadButton =
                document.getElementById('downloadButton');

            loading.style.display = 'block';

            image.style.display = 'none';

            downloadButton.style.display = 'none';

            try {

                // ====================================
                // Azure Function URL
                // ====================================

                const functionUrl =
                    'https://testhttp-f6ehaqhvh3hvezcc.eastus2-01.azurewebsites.net/api/HttpTrigger2';

                // ====================================
                // API CALL
                // ====================================

                const response = await fetch(functionUrl, {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        prompt: prompt
                    })
                });

                if (!response.ok) {
                    throw new Error(
                        'HTTP Error: ' + response.status
                    );
                }

                // ====================================
                // IMAGE BLOB
                // ====================================

                const blob = await response.blob();

                const imageUrl =
                    URL.createObjectURL(blob);

                // ====================================
                // IMAGE DISPLAY
                // ====================================

                image.src = imageUrl;

                image.style.display = 'block';

                // ====================================
                // DOWNLOAD BUTTON
                // ====================================

                downloadButton.href = imageUrl;

                downloadButton.style.display = 'inline-block';

            }
            catch (error) {

                console.error(error);

                alert(
                    'エラーが発生しました: ' +
                    error.message
                );
            }
            finally {

                loading.style.display = 'none';
            }
        }

    </script>

</body>
</html>
