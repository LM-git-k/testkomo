<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI財務ダッシュボード ジェネレーター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           CSS VARIABLES
        ============================================ */
        :root {
            --bg:           #fdf8f0;
            --bg2:          #f5efe3;
            --white:        #ffffff;
            --coral:        #ff6b4a;
            --coral-lt:     #fff0ed;
            --coral-mid:    #ffcfc6;
            --sky:          #0099e6;
            --sky-lt:       #e3f4ff;
            --sky-mid:      #9dd8f7;
            --mint:         #00c896;
            --mint-lt:      #e0faf3;
            --amber:        #f5a623;
            --amber-lt:     #fff8e6;
            --purple:       #8b5cf6;
            --purple-lt:    #f3effe;
            --ink:          #1a1630;
            --ink-mid:      #4a4568;
            --ink-soft:     #8a87a0;
            --border:       #e8e2d8;
            --border2:      #d4ccbe;
            --shadow-sm:    0 2px 8px rgba(26,22,48,0.08);
            --shadow-md:    0 6px 24px rgba(26,22,48,0.10);
            --shadow-lg:    0 12px 40px rgba(26,22,48,0.14);
            --radius-sm:    10px;
            --radius-md:    16px;
            --radius-lg:    24px;
            --nunito:       'Nunito', sans-serif;
            --noto:         'Noto Sans JP', sans-serif;
        }

        /* ============================================
           RESET & BASE
        ============================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--noto);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* decorative blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 600px; height: 600px;
            top: -200px; right: -200px;
            background: radial-gradient(circle, rgba(255,107,74,0.12) 0%, transparent 65%);
        }
        body::after {
            width: 500px; height: 500px;
            bottom: -150px; left: -150px;
            background: radial-gradient(circle, rgba(0,153,230,0.10) 0%, transparent 65%);
        }

        /* ============================================
           LAYOUT
        ============================================ */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 24px 100px;
        }

        /* ============================================
           HEADER
        ============================================ */
        .header {
            margin-bottom: 36px;
            animation: popUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--coral-lt);
            color: var(--coral);
            font-family: var(--nunito);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 100px;
            margin-bottom: 14px;
        }
        .header-badge .dot {
            width: 7px; height: 7px;
            background: var(--coral);
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        .header h1 {
            font-family: var(--nunito);
            font-size: clamp(24px, 4.5vw, 38px);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.03em;
            color: var(--ink);
        }

        .header h1 .accent { color: var(--coral); }

        .header-sub {
            margin-top: 10px;
            font-size: 14px;
            color: var(--ink-soft);
            font-weight: 400;
        }

        /* ============================================
           COMPANY NAME FIELD
        ============================================ */
        .company-field {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 22px 26px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 18px;
            animation: popUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both 0.05s;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .company-field:focus-within {
            border-color: var(--coral);
            box-shadow: 0 0 0 4px rgba(255,107,74,0.12), var(--shadow-sm);
        }

        .company-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--coral), #ff9a4a);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .company-field-inner { flex: 1; }

        .company-label {
            font-family: var(--nunito);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-soft);
            display: block;
            margin-bottom: 4px;
        }

        .company-input {
            width: 100%;
            background: none;
            border: none;
            font-family: var(--noto);
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            outline: none;
        }
        .company-input::placeholder { color: var(--ink-soft); font-weight: 400; font-size: 16px; }

        /* ============================================
           CARD
        ============================================ */
        .card {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            animation: popUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
            transition: box-shadow 0.2s;
        }
        .card:hover { box-shadow: var(--shadow-md); }

        /* ============================================
           TABS
        ============================================ */
        .tab-bar {
            display: flex;
            gap: 8px;
            background: var(--bg2);
            border-radius: 100px;
            padding: 5px;
            margin-bottom: 26px;
            width: fit-content;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 9px 22px;
            font-family: var(--nunito);
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-soft);
            cursor: pointer;
            border-radius: 100px;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--coral);
            box-shadow: var(--shadow-sm);
            transform: scale(1.02);
        }

        .tab-btn:hover:not(.active) { color: var(--ink-mid); }

        .tab-pane { display: none; animation: fadeSlide 0.25s ease; }
        .tab-pane.active { display: block; }

        /* ============================================
           SAMPLE BUTTON STRIP
        ============================================ */
        .sample-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .sample-label {
            font-family: var(--nunito);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .btn-sample {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--amber-lt);
            border: 1.5px solid #f5c66050;
            color: #b87b00;
            font-family: var(--nunito);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
        }
        .btn-sample:hover {
            background: #f5a623;
            color: #fff;
            border-color: #f5a623;
            transform: scale(1.05);
        }
        .btn-sample:active { transform: scale(0.97); }

        /* ============================================
           TEXTAREA
        ============================================ */
        .field-group { margin-bottom: 16px; }

        .field-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: var(--nunito);
            font-size: 13px;
            font-weight: 800;
            color: var(--ink-mid);
            margin-bottom: 8px;
        }

        .field-label .dot {
            width: 8px; height: 8px; border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-coral { background: var(--coral); }
        .dot-sky   { background: var(--sky); }
        .dot-mint  { background: var(--mint); }

        .field-hint {
            font-size: 11.5px;
            color: var(--ink-soft);
            margin-top: 5px;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-family: 'Noto Sans JP', monospace;
            font-size: 12.5px;
            line-height: 1.75;
            padding: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea::placeholder {
            color: var(--ink-soft);
            font-size: 12px;
        }
        textarea:focus {
            border-color: var(--sky);
            box-shadow: 0 0 0 4px rgba(0,153,230,0.10);
            background: var(--white);
        }

        /* ============================================
           INDIVIDUAL TAB — YEAR BLOCKS
        ============================================ */
        .year-block {
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
            background: #fcfaf7;
            position: relative;
            animation: popUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
            transition: border-color 0.2s;
        }
        .year-block:hover { border-color: var(--border2); }

        .year-block-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .year-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--sky-lt);
            color: var(--sky);
            font-family: var(--nunito);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 100px;
            border: 1.5px solid var(--sky-mid);
            white-space: nowrap;
        }

        .year-input {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-family: var(--nunito);
            font-size: 15px;
            font-weight: 700;
            padding: 6px 14px;
            width: 110px;
            outline: none;
            transition: border-color 0.2s;
        }
        .year-input:focus { border-color: var(--sky); }

        .remove-year-btn {
            margin-left: auto;
            background: var(--bg2);
            border: 2px solid var(--border);
            color: var(--ink-soft);
            border-radius: 8px;
            width: 32px; height: 32px;
            cursor: pointer;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            flex-shrink: 0;
        }
        .remove-year-btn:hover {
            background: #fff0ed;
            border-color: var(--coral);
            color: var(--coral);
            transform: rotate(10deg) scale(1.1);
        }

        .statement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 680px) { .statement-grid { grid-template-columns: 1fr; } }

        .stmt-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: var(--nunito);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.07em;
            padding: 3px 10px;
            border-radius: 100px;
            margin-bottom: 8px;
        }
        .stmt-tag .dot { width: 6px; height: 6px; border-radius: 50%; }
        .tag-pl { background: var(--sky-lt);    color: var(--sky);    border: 1.5px solid var(--sky-mid);  }
        .tag-bs { background: var(--amber-lt);  color: #b87b00;       border: 1.5px solid #f5c66080; }
        .tag-cf { background: var(--mint-lt);   color: #007d5e;       border: 1.5px solid #00c89680; }

        .add-year-btn {
            width: 100%;
            background: none;
            border: 2px dashed var(--border2);
            border-radius: var(--radius-md);
            color: var(--ink-soft);
            font-family: var(--nunito);
            font-size: 13px;
            font-weight: 700;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }
        .add-year-btn:hover {
            border-color: var(--sky);
            color: var(--sky);
            background: var(--sky-lt);
            transform: scale(1.01);
        }

        /* ============================================
           GENERATE BUTTON
        ============================================ */
        .generate-card {
            background: linear-gradient(135deg, #fff7f5 0%, #f0f8ff 100%);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 20px;
            animation: popUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both 0.2s;
        }

        .generate-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-generate {
            position: relative;
            background: linear-gradient(135deg, var(--coral), #ff9a4a);
            border: none;
            border-radius: 100px;
            color: #fff;
            font-family: var(--nunito);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.03em;
            padding: 16px 36px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,107,74,0.40);
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            overflow: hidden;
        }
        .btn-generate:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 10px 28px rgba(255,107,74,0.50);
        }
        .btn-generate:active { transform: scale(0.97); }
        .btn-generate:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-generate::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ff9a4a, var(--coral));
            opacity: 0;
            transition: opacity 0.2s;
        }
        .btn-generate:hover::after { opacity: 1; }
        .btn-generate span { position: relative; z-index: 1; }

        .status-badge {
            font-family: var(--nunito);
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-soft);
            background: var(--bg2);
            padding: 6px 14px;
            border-radius: 100px;
            border: 1.5px solid var(--border);
        }

        /* ============================================
           PROMPT PREVIEW
        ============================================ */
        .prompt-section {
            margin-top: 20px;
            border-top: 2px dashed var(--border);
            padding-top: 18px;
        }

        .prompt-toggle {
            background: none;
            border: none;
            font-family: var(--nunito);
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-soft);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
            letter-spacing: 0.05em;
        }
        .prompt-toggle:hover { color: var(--sky); }

        .prompt-toggle .arrow {
            font-size: 10px;
            transition: transform 0.2s;
        }
        .prompt-toggle.open .arrow { transform: rotate(90deg); }

        .prompt-body {
            display: none;
            margin-top: 12px;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            font-family: 'Noto Sans JP', monospace;
            font-size: 11.5px;
            color: var(--ink-mid);
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 220px;
            overflow-y: auto;
        }
        .prompt-body.open { display: block; }

        /* ============================================
           LOADING
        ============================================ */
        .loading-area {
            display: none;
            margin-top: 22px;
            background: linear-gradient(135deg, var(--sky-lt), var(--mint-lt));
            border: 2px solid var(--sky-mid);
            border-radius: var(--radius-md);
            padding: 22px 24px;
        }

        .loading-inner { display: flex; align-items: center; gap: 16px; }

        .spinner-wrap {
            position: relative;
            width: 42px; height: 42px;
            flex-shrink: 0;
        }
        .spinner {
            width: 42px; height: 42px;
            border: 3px solid var(--sky-mid);
            border-top-color: var(--sky);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-family: var(--nunito);
            font-size: 14px;
            font-weight: 700;
            color: var(--sky);
        }
        .loading-sub {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 3px;
        }

        .progress-wrap {
            height: 6px;
            background: rgba(0,153,230,0.15);
            border-radius: 100px;
            margin-top: 14px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--sky), var(--mint));
            border-radius: 100px;
            animation: progress 120s linear both;
        }

        /* ============================================
           RESULT
        ============================================ */
        .result-area {
            display: none;
            margin-top: 22px;
            animation: popUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--mint-lt);
            color: #007d5e;
            font-family: var(--nunito);
            font-size: 12px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 100px;
            border: 1.5px solid rgba(0,200,150,0.4);
        }
        .result-badge .dot {
            width: 7px; height: 7px;
            background: var(--mint);
            border-radius: 50%;
            animation: pulse 1.5s ease infinite;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--ink);
            border: none;
            border-radius: 100px;
            color: #fff;
            font-family: var(--nunito);
            font-size: 13px;
            font-weight: 700;
            padding: 10px 22px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }
        .btn-download:hover {
            transform: translateY(-1px) scale(1.04);
            box-shadow: 0 6px 18px rgba(26,22,48,0.3);
        }

        .result-img-wrap {
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .result-img-wrap img { width: 100%; display: block; }

        /* ============================================
           ANIMATIONS
        ============================================ */
        @keyframes popUp {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(8px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        @keyframes progress {
            0%   { width: 0%; }
            60%  { width: 72%; }
            85%  { width: 85%; }
            100% { width: 92%; }
        }

        /* ============================================
           SCROLLBAR
        ============================================ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
        
        /* ==========================================
           PROMPT PREVIEW
        ========================================== */
        
        .prompt-body{
            display:none;
            margin-top:14px;
            padding:18px;
            border-radius:16px;
            background:#0f172a;
            color:#dbeafe;
            white-space:pre-wrap;
            font-size:13px;
            line-height:1.7;
            border:1px solid rgba(255,255,255,0.08);
            max-height:400px;
            overflow:auto;
        }
        
        .prompt-body.open{
            display:block;
        }
        
        /* ==========================================
           GENERATE BUTTON DISABLED
        ========================================== */
        
        .btn-generate:disabled{
            opacity:0.45;
            cursor:not-allowed;
            transform:none !important;
            filter:grayscale(0.2);
        }
    </style>
</head>

<body>
<div class="wrapper">

    <!-- ==========================================
         HEADER
    ========================================== -->
    <header class="header">
        <div class="header-badge">
            <span class="dot"></span>
            AI Financial Analytics
        </div>
        <h1>AI財務ダッシュボード<br><span class="accent">ジェネレーター　【Created by Komori】</span></h1>
        <p class="header-sub">財務データを貼り付けるだけで、AIがプロ品質のダッシュボードスライドを自動生成します ✨</p>
    </header>

    <!-- ==========================================
         COMPANY NAME
    ========================================== -->
    <div class="company-field">
        <div class="company-icon">🏢</div>
        <div class="company-field-inner">
            <span class="company-label">会社名 / Company Name</span>
            <input type="text" class="company-input" id="companyName"
                placeholder="ここに会社名を入れる">
        </div>
    </div>

    <!-- ==========================================
         INPUT CARD
    ========================================== -->
    <div class="card" style="animation-delay:0.1s">

        <!-- TAB BAR -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('bulk', this)">
                📋 一括入力（残高試算表）
            </button>
            <button class="tab-btn" onclick="switchTab('individual', this)">
                📊 個別入力（PL / BS / CF）
            </button>
        </div>

        const bs =
            b.querySelector('[id^="bs-"]')
                ?.value
                .trim() || '（未入力）';

        const cf =
            b.querySelector('[id^="cf-"]')
                ?.value
                .trim() || '（未入力）';

        dataSec += `【${yr}年度】

▼PL
${pl}

▼BS
${bs}

▼CF
${cf}

--------------------------------

`;
    });

    return dataSec.trim();
}

            .value
            .trim() || '対象会社';

// ================================================
// GENERATE
// ================================================
async function generateDashboard() {

    const company =
        document.getElementById('companyName')
            .value
            .trim() || '対象会社';

    const financialData =
        buildFinancialData();

    if (!financialData.trim()) {

        alert('財務データを入力してください。');

        return;
    }

    const btn =
        document.getElementById('generateBtn');

    const badge =
        document.getElementById('statusBadge');

    const loadingArea =
        document.getElementById('loadingArea');

    const resultArea =
        document.getElementById('resultArea');

    const progressBar =
        document.getElementById('progressBar');

    btn.disabled = true;

    badge.textContent = '⏳ 生成中...';

    loadingArea.style.display = 'block';

    resultArea.style.display = 'none';

    // progress reset
    progressBar.style.animation = 'none';

    void progressBar.offsetHeight;

    progressBar.style.animation = '';

    try {

        // =====================================
        // REQUEST BODY
        // =====================================
        const requestBody = {
            mode: activeTab,
            company: company,
            financialData: financialData
        };

        // =====================================
        // API CALL
        // =====================================
        const response = await fetch(
            FUNCTION_URL,
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(requestBody)
            }
        );

        if (!response.ok) {

            const errText =
                await response.text().catch(() => '');

            throw new Error(
                `HTTP ${response.status}: ${errText}`
            );
        }

        // =====================================
        // IMAGE
        // =====================================
        const blob =
            await response.blob();

        const imageUrl =
            URL.createObjectURL(blob);

        document.getElementById('resultImage').src =
            imageUrl;

        document.getElementById('downloadBtn').href =
            imageUrl;

        resultArea.style.display = 'block';

        badge.textContent = '✅ 生成完了！';

    } catch (err) {

        console.error(err);

        alert(
            'エラーが発生しました:\n' +
            err.message
        );

        badge.textContent = '❌ エラー';

    } finally {

        btn.disabled = false;

        loadingArea.style.display = 'none';

        progressBar.style.animation = 'none';
    }
}
